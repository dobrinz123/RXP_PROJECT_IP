services:
  db:
    image: postgres:15
    restart: unless-stopped
    # SEC-05: credentialele sunt centralizate in backend/.env.docker (o singura sursa de adevar)
    env_file:
      - ./backend/.env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db
    expose:
      - "8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/invoices:/app/invoices

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # HTTP — redirectat automat la HTTPS de nginx
      - "127.0.0.1:8443:443"  # SEC-04: HTTPS (schimba la 0.0.0.0:443:443 in productie)
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./admin_ui:/usr/share/nginx/html_admin:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # SEC-04: certificate SSL (fullchain.pem + privkey.pem)
      - ./nginx/certbot:/var/www/certbot:ro  # SEC-04: Let's Encrypt webroot challenge
    depends_on:
      - api

volumes:
  pgdata:
