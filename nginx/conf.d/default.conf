server {
  listen 80 default_server;
  server_name _;

  # frontend public
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # admin UI (se vede doar local pentru că portul e publicat pe 127.0.0.1 în compose)
  location /admin/ {
    alias /usr/share/nginx/html_admin/;
    index index.html;
    try_files $uri $uri/ =404;
  }

  # proxy către API
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # static (cache)
  location ~* \.(png|jpg|jpeg|gif|webp|svg|css|js|woff2?|ttf)$ {
    try_files $uri =404;
    access_log off;
    expires 30d;
  }
}
