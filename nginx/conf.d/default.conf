limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=30r/m;

# ── SEC-04: Redirect HTTP → HTTPS ────────────────────────────────────────────
server {
  listen 80 default_server;
  server_name _;

  # Permite reinnoire certificate Let's Encrypt (Certbot webroot challenge)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Toate celelalte requesturi → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS principal ───────────────────────────────────────────────────────────
# PRERECHIZITE (una din variante):
#   A) Let's Encrypt (productie):
#        certbot --nginx -d example.com -d www.example.com
#        Certbot va actualiza automat acest fisier si va reinnoi certificatele.
#   B) Certificat self-signed (dezvoltare/testare):
#        mkdir -p ./nginx/certs
#        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#          -keyout ./nginx/certs/privkey.pem \
#          -out    ./nginx/certs/fullchain.pem \
#          -subj "/C=RO/ST=Bucuresti/O=RXP/CN=localhost"
#   Monteaza folderul in docker-compose.yml (vezi volumul ssl_certs).

server {
  listen 443 ssl default_server;
  server_name _;
  http2 on;

  # ── Certificate SSL ──
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # ── Protocol si ciphers moderne (TLS 1.2+ only) ──
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_tickets off;

  # ── Security headers ──
  add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options     "nosniff" always;
  add_header X-Frame-Options            "DENY" always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
  # LOW-04: X-XSS-Protection removed — deprecated, no effect in modern browsers; CSP is the correct defence
  # HIGH-06: removed 'unsafe-inline' from script-src; add https://js.stripe.com when Stripe UI is enabled
  add_header Content-Security-Policy    "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com" always;
  add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;


  # frontend public
  root /usr/share/nginx/html;
  index index.html;

  # Clean URLs — redirecta /pagina.html → /pagina
  location ~ ^/([^/]+)\.html$ {
    return 301 /$1$is_args$args;
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }


  # admin UI
  location /admin/ {
    alias /usr/share/nginx/html_admin/;
    index index.html;
    try_files $uri $uri.html $uri/ =404;
  }

  # ── Rate-limited auth endpoints ──
  location /api/auth/login {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://api:8000/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/auth/register {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://api:8000/auth/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # HIGH-01: rate limit change-password same as login (prevents brute-forcing current_password)
  location /api/auth/change-password {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://api:8000/auth/change-password;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # MED-08: rate limit checkout to prevent stock depletion attacks
  location /api/orders/checkout-cod {
    limit_req zone=api_write burst=5 nodelay;
    proxy_pass http://api:8000/orders/checkout-cod;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Rate-limited custom requests (SEC-03: exact prefix match cu regex) ──
  location ~ ^/api/custom-requests(/|$) {
    limit_req zone=api_write burst=5 nodelay;
    client_max_body_size 25m;
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── General API proxy (BUG-28: adaugat client_max_body_size) ──
  location /api/ {
    client_max_body_size 10m;
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # static assets — long cache for images/fonts
  location ~* \.(png|jpg|jpeg|gif|webp|svg|woff2?|ttf)$ {
    try_files $uri =404;
    access_log off;
    expires 30d;
  }

  # JS + CSS — always revalidate so fixes take effect immediately
  location ~* \.(js|css)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    expires 0;
  }
}
