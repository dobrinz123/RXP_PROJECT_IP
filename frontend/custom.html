<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerere produs personalizat - RXP CUSTOM3D</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js?v=20260427"></script>
</head>
<body data-page="custom">
  <div id="site-header"></div>

  <main class="page-shell">
    <div class="container" style="max-width: 640px;">
      <section class="form-card">
        <div class="page-intro">
          <span class="section-eyebrow">Personalizare</span>
          <h1 class="page-title">Cerere produs personalizat</h1>
          <p class="page-copy">Completează formularul de mai jos pentru a solicita un produs personalizat. Atașează imagini de referință și descrie în detaliu ce îți dorești.</p>
        </div>

        <p id="custom-success" class="status-message success hidden" role="status" aria-live="polite"></p>

        <form id="custom-form" novalidate>
          <div class="field" data-field="name">
            <label class="field-label" for="custom-name">Nume complet</label>
            <input class="input" type="text" id="custom-name" name="name" placeholder="Ex. Andrei Popescu" required>
            <p class="field-error" hidden></p>
          </div>

          <div class="field" data-field="email">
            <label class="field-label" for="custom-email">Email</label>
            <input class="input" type="email" id="custom-email" name="email" placeholder="tu@exemplu.ro" required>
            <p class="field-error" hidden></p>
          </div>

          <div class="field" data-field="description">
            <label class="field-label" for="custom-description">Descriere produs</label>
            <textarea class="textarea" id="custom-description" name="description" placeholder="Spune-ne ce model vrei, pentru ce mașină și ce preferințe ai." required></textarea>
            <p class="field-error" hidden></p>
          </div>

          <div class="field" data-field="files">
            <span class="field-label">Fișiere de referință</span>
            <label id="custom-dropzone" class="dropzone" for="custom-files">
              <span data-icon="upload"></span>
              <strong>Trage fișierele aici sau apasă pentru a alege</strong>
              <span class="dropzone-copy">PNG, JPG, PDF, STL până la 5MB</span>
            </label>
            <input class="visually-hidden" type="file" id="custom-files" accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.stl,.obj,.step,.stp" multiple>
            <div id="file-preview-grid" class="file-preview-grid"></div>
            <p class="field-error" hidden></p>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Trimite cererea</button>
        </form>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
