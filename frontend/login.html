<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autentificare - RXP CUSTOM3D</title>
  <link rel="stylesheet" href="style.css?v=20260517b">
  <script defer src="script.js?v=20260517b"></script>
</head>
<body data-page="login">
  <div id="site-header"></div>

  <main class="auth-page page-shell">
    <div class="container" style="max-width: 520px;">
      <section class="auth-card">
        <div class="page-intro">
          <span class="section-eyebrow">Cont client</span>
          <h1 class="page-title">Autentificare</h1>
          <p>Intră în cont pentru a gestiona coșul, comenzile și cererile personalizate.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="field" data-field="email">
            <label class="field-label" for="login-email">Email</label>
            <input class="input" type="email" id="login-email" name="email" required>
            <p class="field-error" hidden></p>
          </div>

          <div class="field" data-field="password">
            <label class="field-label" for="login-password">Parolă</label>
            <input class="input" type="password" id="login-password" name="password" required>
            <p class="field-error" hidden></p>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Autentifică-te</button>
          <p id="login-status" class="status-message hidden" role="status" aria-live="polite"></p>
        </form>

        <p class="helper-text" style="margin-top: 24px;">Nu ai cont? <a class="inline-link" href="register.html">Înregistrează-te aici</a>.</p>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
