<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Înregistrare - RXP CUSTOM3D</title>
  <link rel="stylesheet" href="style.css?v=20260517b">
  <script defer src="script.js?v=20260517b"></script>
</head>
<body data-page="register">
  <div id="site-header"></div>

  <main class="auth-page page-shell">
    <div class="container" style="max-width: 520px;">
      <section class="auth-card">
        <div class="page-intro">
          <span class="section-eyebrow">Cont nou</span>
          <h1 class="page-title">Înregistrare</h1>
          <p>Creează un cont pentru a continua comenzile și pentru a urmări istoricul din contul tău.</p>
        </div>

        <form id="register-form" novalidate>
          <div class="field" data-field="email">
            <label class="field-label" for="register-email">Email</label>
            <input class="input" type="email" id="register-email" name="email" required>
            <p class="field-error" hidden></p>
          </div>

          <div class="field" data-field="password">
            <label class="field-label" for="register-password">Parolă</label>
            <input class="input" type="password" id="register-password" name="password" required>
            <p class="field-error" hidden></p>
          </div>

          <div class="field" data-field="password-confirm">
            <label class="field-label" for="register-password-confirm">Confirmă parola</label>
            <input class="input" type="password" id="register-password-confirm" name="password_confirm" required>
            <p class="field-error" hidden></p>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Înregistrează-te</button>
          <p id="register-status" class="status-message hidden" role="status" aria-live="polite"></p>
        </form>

        <p class="helper-text" style="margin-top: 24px;">Ai deja cont? <a class="inline-link" href="login.html">Autentifică-te aici</a>.</p>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
