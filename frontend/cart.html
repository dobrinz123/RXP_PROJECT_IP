<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coș de cumpărături - RXP CUSTOM3D</title>
  <link rel="stylesheet" href="style.css?v=20260517b">
  <script defer src="script.js?v=20260427"></script>
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <main class="page-shell">
    <div class="container">
      <div class="section-heading">
        <span class="section-eyebrow">Coș</span>
        <h1 class="page-title">Coș de cumpărături</h1>
        <p class="page-copy">Gestionează cantitățile, verifică totalul și finalizează comanda prin același flux de checkout COD deja integrat în backend.</p>
      </div>

      <div class="cart-layout">
        <section>
          <div id="cart-items" aria-live="polite"></div>
        </section>
        <aside id="cart-summary"></aside>
      </div>

      <section id="cod-panel" class="checkout-panel">
        <div class="page-intro">
          <h2>Detalii livrare</h2>
          <p>Completează datele necesare pentru livrarea comenzii.</p>
        </div>

        <form id="cod-form" novalidate>
          <div class="field">
            <label class="field-label" for="cod-full-name">Nume și prenume</label>
            <input class="input" type="text" id="cod-full-name" name="full_name" required>
          </div>

          <div class="field">
            <label class="field-label" for="cod-phone">Telefon</label>
            <input class="input" type="tel" id="cod-phone" name="phone" required>
          </div>

          <div class="field">
            <label class="field-label" for="cod-address">Adresă de livrare</label>
            <textarea class="textarea" id="cod-address" name="address" required></textarea>
          </div>

          <div class="summary-lines" style="margin-bottom: 24px;">
            <div class="summary-line"><span>Produse</span><strong id="sum-products">0,00 RON</strong></div>
            <div class="summary-line"><span>Transport</span><strong id="sum-shipping">25,00 RON</strong></div>
            <div class="summary-line total"><span>Total de plată</span><strong id="sum-total">0,00 RON</strong></div>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Plasează comanda</button>
        </form>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
</body>
</html>
