services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopsecret}
      POSTGRES_DB: ${POSTGRES_DB:-shopdb}
    # port mapped locally optionally, but removed for security
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      - db
    # port 8000 NU este expus public — accesibil doar intern prin Nginx (S9 fix)
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
