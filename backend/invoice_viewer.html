<!doctype html>
<meta charset="utf-8">
<title>Invoice Viewer</title>
<label>API <input id="api" placeholder="(auto-detect: window.origin/api)"></label><br>
<label>Order ID <input id="oid" value="1"></label><br>
<label>Token <input id="tok" style="width:520px"></label><br>
<button onclick="openPdf()">Deschide PDF</button>
<script>
  // H6 fix: auto-detect API base URL from current origin if not entered
  function getApiBase() {
    const val = document.getElementById('api').value.trim().replace(/\/$/, '');
    return val || (window.location.origin + '/api');
  }
  async function openPdf() {
    const api = getApiBase();
    const id = document.getElementById('oid').value.trim();
    const tok = document.getElementById('tok').value.trim();
    const r = await fetch(`${api}/admin/orders/${id}/invoice.pdf`, {
      headers: { Authorization: `Bearer ${tok}` }
    });
    if (!r.ok) { alert('Eroare: ' + r.status); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }
</script>
