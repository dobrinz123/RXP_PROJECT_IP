<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin RXP</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ═══════════ AUTH BLOCKER ═══════════ -->
<div id="auth-blocker">
  <div class="login-card">
    <span class="lock-icon">🔒</span>
    <h1>Admin RXP</h1>
    <p class="subtitle">Autentifică-te pentru a accesa panoul de administrare</p>
    <form id="login-form" autocomplete="on">
      <input id="login-email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="login-pass" type="password" placeholder="Parolă" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Autentificare</button>
    </form>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ═══════════ ADMIN CONTENT (hidden until auth) ═══════════ -->
<div id="admin-content">
  <header>
    <h1>Admin RXP</h1>
    <div class="header-user">
      <span class="user-email" id="admin-email-display"></span>
      <button id="btn-logout" type="button">Logout</button>
    </div>
  </header>

  <main>
    <div class="tabs">
      <div class="tab active" data-t="active">Comenzi active</div>
      <div class="tab" data-t="done">Comenzi finalizate</div>
      <div class="tab" data-t="invoices">Facturi</div>
      <div class="tab" data-t="products">Produse</div>
      <div class="tab" data-t="settings">Setari Firma</div>
    </div>

    <section id="panel-active" class="card">
      <div class="row">
        <select id="statusActive">
          <option value="">(toate)</option>
          <option>created</option>
          <option>pending</option>
          <option>paid</option>
          <option>processing</option>
          <option>shipped</option>
        </select>
        <button id="btn-load-active" type="button">Load</button>
      </div>
      <div id="activeList"></div>
    </section>

    <section id="panel-done" class="card" style="display:none">
      <div class="row">
        <select id="statusDone">
          <option value="">(toate)</option>
          <option>delivered</option>
          <option>canceled</option>
        </select>
        <button id="btn-load-done" type="button">Load</button>
      </div>
      <div id="doneList"></div>
    </section>

    <section id="panel-invoices" class="card" style="display:none">
      <div class="row">
        <input id="qinvoice" placeholder="caută nr. factură">
        <button id="btn-load-invoices" type="button">Caută</button>
      </div>
      <div id="invoiceList"></div>
    </section>

    <section id="panel-products" class="card" style="display:none">
      <div class="row"><button id="btn-reload-products" type="button">Reîncarcă</button></div>
      <div id="prodList" style="margin:10px 0"></div>

      <h3>Adaugă / editează</h3>
      <div class="row">
        <input id="pid" placeholder="ID (gol pt. add)">
        <input id="sku" placeholder="SKU">
        <input id="name" placeholder="Nume">
        <input id="price" placeholder="Preț (bani)">
        <input id="stock" placeholder="Stoc">
        <input id="image_url" placeholder="URL imagine">
        <select id="category">
          <option value="">(fără)</option>
          <option value="car_tuning">Car Tuning</option>
          <option value="suporti_numar">Suporti numar</option>
        </select>
        <input id="tags" placeholder="Taguri (ex: mercedes,toyota,bmw)">
        <label>Activ? <input id="active" type="checkbox" checked></label>
      </div>
      <div class="row"><textarea id="desc" placeholder="descriere" style="width:100%;height:80px"></textarea></div>
      <div class="row">
        <button id="btn-save" type="button">Salvează</button>
        <button id="btn-del" type="button">Șterge după ID</button>
      </div>
    </section>

    <section id="panel-settings" class="card" style="display:none">
      <h3>Date Firmă</h3>
      <p style="color:#666;font-size:13px;margin-top:0">Aceste date apar automat pe facturile generate.</p>
      <form id="company-form" style="display:grid;gap:12px;max-width:520px">
        <label>
          <span style="display:block;font-weight:600;margin-bottom:4px">Denumire Firmă</span>
          <input id="co-name" type="text" placeholder="ex: SC RXP CUSTOM3D SRL" style="width:100%">
        </label>
        <label>
          <span style="display:block;font-weight:600;margin-bottom:4px">CIF / CUI</span>
          <input id="co-cif" type="text" placeholder="ex: RO12345678" style="width:100%">
        </label>
        <label>
          <span style="display:block;font-weight:600;margin-bottom:4px">Registrul Comerțului</span>
          <input id="co-regcom" type="text" placeholder="ex: J40/1234/2024" style="width:100%">
        </label>
        <label>
          <span style="display:block;font-weight:600;margin-bottom:4px">Adresă Sediu</span>
          <input id="co-address" type="text" placeholder="ex: Str. Exemplu nr. 1, București" style="width:100%">
        </label>
        <label>
          <span style="display:block;font-weight:600;margin-bottom:4px">Cont Bancar (IBAN)</span>
          <input id="co-iban" type="text" placeholder="ex: RO49AAAA1B31007593840000" style="width:100%">
        </label>
        <div>
          <button type="submit"
            style="background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer">Salvează</button>
          <span id="co-msg" style="margin-left:12px;font-size:13px"></span>
        </div>
      </form>
    </section>
  </main>
</div>

<script src="admin.js"></script>
</body>
</html>
