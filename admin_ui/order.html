<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalii comandă - Admin</title>
  <link rel="stylesheet" href="order.css">
</head>
<body>
  <header>
    <div class="brand">Admin Panel</div>
    <div class="toolbar">
      <a class="back" href="./">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Înapoi la comenzi
      </a>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>Detalii comandă <span id="oid" class="pill"></span></h1>

      <div class="row">
        <div class="muted">Status</div>
        <div id="status">-</div>
      </div>
      <div class="row">
        <div class="muted">Data</div>
        <div id="created_at">-</div>
      </div>
      <div class="row">
        <div class="muted">Metodă plată</div>
        <div id="payment_method">-</div>
      </div>

      <h2>Client & livrare</h2>
      <div class="row">
        <div class="muted">Nume</div>
        <div id="billing_name">-</div>
      </div>
      <div class="row">
        <div class="muted">Telefon</div>
        <div id="phone">-</div>
      </div>
      <div class="row">
        <div class="muted">Adresă</div>
        <div id="shipping_address">-</div>
      </div>

      <h2>Produse</h2>
      <table>
        <thead>
          <tr>
            <th>Produs</th>
            <th class="right">Cant.</th>
            <th class="right">Preț</th>
            <th class="right">Subtotal</th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
      </table>

      <div class="totals">
        <div class="line">
          <div class="muted right">Produse</div>
          <div class="right" id="subtotal"></div>
        </div>
        <div class="line">
          <div class="muted right">Transport</div>
          <div class="right" id="shipping"></div>
        </div>
        <div class="line" style="font-weight:700">
          <div class="right">Total</div>
          <div class="right" id="total"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="order.js"></script>
</body>
</html>
